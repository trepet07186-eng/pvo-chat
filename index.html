<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ЗАС-Чат ПВО</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#121417;color:#e6e6e6;font-family:Consolas,monospace;height:100dvh;display:flex;flex-direction:column}
  #loginScreen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;gap:12px}
  .card{background:#1a1e24;border:1px solid #333;border-radius:8px;padding:18px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
  input{background:#101216;color:#00ff66;border:1px solid #444;border-radius:4px;padding:9px;font-family:inherit;font-size:14px;width:100%}
  button{background:#1e5631;border:1px solid #33ff66;color:#fff;border-radius:4px;padding:10px;font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer}
  #chatScreen{display:none;flex:1;flex-direction:column;height:100dvh}
  .top{background:#1a1d23;border-bottom:1px solid #333;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
  #box{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .msg{background:#1b1f26;border:1px solid #2e3440;border-radius:6px;padding:8px;max-width:92%;word-break:break-word}
  .mine{align-self:flex-end;border-color:#2b5b3c;background:#17261e}
  .meta{font-size:11px;color:#8c96a6;margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
  .fbox{margin-top:6px;padding:5px 8px;background:#13161b;border:1px dashed #33aaff;border-radius:4px;display:flex;justify-content:space-between;align-items:center}
  .fbtn{background:#1f4e78;color:#fff;padding:4px 8px;border-radius:3px;text-decoration:none;font-size:12px}
  .bot{background:#181b20;border-top:1px solid #333;padding:8px;display:flex;gap:6px}
  textarea{flex:1;background:#101216;color:#fff;border:1px solid #444;border-radius:4px;padding:7px;font-family:inherit;font-size:13px;height:38px;resize:none}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="card">
    <div style="color:#00ff66;font-weight:bold;font-size:16px;text-align:center">🛡 КАНАЛ СВЯЗИ ПВО</div>
    <input id="inGroup" placeholder="Группа (например: ПФО-01)">
    <input id="inCall" placeholder="Позывной (например: МОГ-1)">
    <input id="inCode" placeholder="Код суток (с экрана КП)">
    <button onclick="enterChat()">ВОЙТИ В ЭФИР</button>
    <div id="loginErr" style="color:#ff5555;font-size:12px;text-align:center"></div>
  </div>
</div>
<div id="chatScreen">
  <div class="top">
    <span id="hdrInfo" style="color:#33aaff;font-weight:bold"></span>
    <span id="netSt" style="color:#ffd23f">⏳ Подключение...</span>
    <button onclick="exitChat()" style="padding:4px 8px;font-size:11px;background:#3a2020;border-color:#ff5555">Выход</button>
  </div>
  <div id="box"></div>
  <div class="bot">
    <label style="background:#2b313c;border:1px solid #555;padding:7px 10px;border-radius:4px">📎<input type="file" id="fi" style="display:none"></label>
    <textarea id="mi" placeholder="Донесение..."></textarea>
    <button onclick="send()" style="padding:0 14px">➤</button>
  </div>
</div>
<script>
let GRP="", CALL="", CODE="", TOPIC="", ws=null, pingT=null, bIdx=0, raw=[], seen=new Set();
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://://hivemq.com", "wss://test.mosquitto.org:8081/mqtt"];
const dayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  if (window.crypto && crypto.subtle) { const h = await crypto.subtle.digest('SHA-256', buf); return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join(''); }
  let h1 = 0x811c9dc5, h2 = 0x1b873593;
  for (let i = 0; i < buf.length; i++) { h1 = Math.imul(h1 ^ buf[i], 0x01000193); h2 = Math.imul(h2 ^ buf[i], 0x85ebca6b); }
  return ((h1 >>> 0).toString(16).padStart(8,'0') + (h2 >>> 0).toString(16).padStart(8,'0')).repeat(4);
}
async function streamXor(bytes, keyStr, saltHex) {
  const out = new Uint8Array(bytes.length); let blk = 0, ks = new Uint8Array(0);
  for (let i = 0; i < bytes.length; i++) {
    if (i % 32 === 0) { const hex = await sha256Hex(keyStr + "::" + saltHex + "::" + (blk++)); ks = new Uint8Array(hex.match(/.{2}/g).map(h => parseInt(h, 16))); }
    out[i] = bytes[i] ^ ks[i % 32];
  }
  return out;
}
const b2a = u => { let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s); };
const a2b = s => { const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
function encLen(n) { const r=[]; do { let d=n%128; n=Math.floor(n/128); if(n>0) d|=128; r.push(d); } while(n>0); return r; }
function strBytes(s) { const b=new TextEncoder().encode(s); return [b.length>>8, b.length&255, ...b]; }
function pktConnect(cid) { const vh=, pl=strBytes(cid); return new Uint8Array([0x10, ...encLen(vh.length+pl.length), ...vh, ...pl]); }
function pktSub(topic) { const pl=[0,1, ...strBytes(topic), 0]; return new Uint8Array([0x82, ...encLen(pl.length), ...pl]); }
function pktPub(topic, msg) { const t=strBytes(topic), m=new TextEncoder().encode(msg); return new Uint8Array([0x30, ...encLen(t.length+m.length), ...t, ...m]); }

async function enterChat() {
  GRP = document.getElementById('inGroup').value.trim().toUpperCase(); CALL = document.getElementById('inCall').value.trim(); CODE = document.getElementById('inCode').value.trim();
  if (!GRP || !CALL || !CODE) { document.getElementById('loginErr').textContent = "Заполните все 3 поля!"; return; }
  TOPIC = 'pvo_zas_v3_' + (await sha256Hex('PVO-CH-' + GRP)).slice(0, 24);
  document.getElementById('loginScreen').style.display = 'none'; document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('hdrInfo').textContent = `${GRP} | ${CALL}`; startWs();
}
function exitChat() {
  if (pingT) clearInterval(pingT); if (ws) { try { ws.close(); } catch(e){} }
  raw = []; seen.clear(); document.getElementById('box').innerHTML = '';
  document.getElementById('chatScreen').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex';
}
function startWs() {
  if (pingT) clearInterval(pingT);
  const url = BROKERS[bIdx % BROKERS.length]; bIdx++;
  document.getElementById("netSt").textContent = "⏳ Сеть (" + bIdx + ")..."; document.getElementById("netSt").style.color = "#ffd23f";
  ws = new WebSocket(url, "mqtt"); ws.binaryType = "arraybuffer";
  ws.onopen = () => { ws.send(pktConnect("pvo_" + Math.random().toString(16).slice(2, 10))); };
  ws.onmessage = async (ev) => {
    const u = new Uint8Array(ev.data); if (!u.length) return;
    const t = u & 0xF0;
    if (t === 0x20) {
      document.getElementById("netSt").textContent = "🟢 В СЕТИ"; document.getElementById("netSt").style.color = "#00ff66";
      ws.send(pktSub(TOPIC));
      pingT = setInterval(() => { if (ws && ws.readyState === 1) ws.send(new Uint8Array([0xC0, 0x00])); }, 20000);
    } else if (t === 0x30) {
      let idx = 1, mult = 1, b = 0;
      do { b = u[idx++]; mult *= 128; } while ((b & 128) !== 0);
      const tlen = (u[idx] << 8) | u[idx + 1]; idx += 2 + tlen;
      if (u & 0x06) idx += 2;
      try {
        const pkg = JSON.parse(new TextDecoder().decode(u.subarray(idx)));
        if (pkg.clear) { raw = []; seen.clear(); await render(); return; }
        if (pkg.id && !seen.has(pkg.id)) { seen.add(pkg.id); raw.push(pkg); if (raw.length > 150) raw.shift(); await render(); }
      } catch (e) {}
    }
  };
  ws.onclose = ws.onerror = () => { if (document.getElementById('chatScreen').style.display === 'flex') { document.getElementById("netSt").textContent = "🟡 Повтор..."; setTimeout(startWs, 2000); } };
}
async function send() {
  const tx = document.getElementById('mi').value.trim(), fi = document.getElementById('fi');
  if ((!tx && !fi.files) || !ws || ws.readyState !== 1) return;
  let fd = null;
  if (fi.files) { const f = fi.files; const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')); r.readAsDataURL(f); }); fd = { name: f.name, type: f.type || 'application/octet-stream', b64 }; }
  const salt = Math.random().toString(16).slice(2, 14), encBytes = await streamXor(new TextEncoder().encode(JSON.stringify({ magic: "PVO_OK", sender: CALL, time: new Date().toTimeString().slice(0, 8), text: tx, file: fd })), dayStr() + "::" + CODE, salt);
  document.getElementById('mi').value = ''; fi.value = '';
  ws.send(pktPub(TOPIC, JSON.stringify({ id: Date.now() + "_" + Math.floor(Math.random()*999), v: 3, s: salt, ct: b2a(encBytes) })));
}
async function render() {
  const box = document.getElementById('box'); box.innerHTML = '';
  for (const it of raw) {
    if (it.v !== 3 || !it.s || !it.ct) continue;
    let dec = null; try { const parsed = JSON.parse(new TextDecoder().decode(await streamXor(a2b(it.ct), dayStr() + "::" + CODE, it.s))); if (parsed && parsed.magic === "PVO_OK") dec = parsed; } catch (e) {}
    if (!dec) continue;
    const d = document.createElement('div'); d.className = 'msg' + (dec.sender === CALL ? ' mine' : '');
    d.innerHTML = `<div class="meta"><b style="color:#33aaff">${dec.sender}</b><span>${dec.time}</span></div>` + (dec.text ? `<div style="white-space:pre-wrap">${dec.text.replace(/</g,'&lt;')}</div>` : '');
    if (dec.file && dec.file.b64) { const fb = document.createElement('div'); fb.className = 'fbox'; const bin = atob(dec.file.b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); const a = document.createElement('a'); a.className = 'fbtn'; a.textContent = 'Скачать'; a.download = dec.file.name; a.href = URL.createObjectURL(new Blob([arr], { type: dec.file.type })); fb.innerHTML = `<span>📦 ${dec.file.name}</span>`; fb.appendChild(a); d.appendChild(fb); }
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
